# Apex Linux: boot menu entries for the other systems whose boot loaders
# share Apex's EFI system partition, such as Ubuntu or Windows beside it.
#
# The installer copies this file from /usr/share/apex/grub2/custom.cfg to
# /boot/grub2/custom.cfg, which bootupd's static grub.cfg sources last. It
# looks for the other loaders on every boot, so a system installed later
# shows up too, and nothing has to regenerate it: bootc upgrades and bootupd
# updates leave this file alone. It uses only commands built into Fedora's
# signed GRUB, and chainloading goes through shim's verification, so it
# works with Secure Boot on.
#
# When it finds another system, the menu stays up for at least 5 seconds;
# otherwise the menu is as bootupd sets it.

if [ "${grub_platform}" = efi ]; then
  # The EFI system partition with Apex's loader, on /boot's disk first.
  # ${cmdpath} would name it, but it does not survive the stub's configfile.
  regexp --set=1:apex_disk '^([^,]+),' "${root}"
  search --no-floppy --file --set=apex_esp --hint="${apex_disk}," \
    /EFI/fedora/shimx64.efi
  apex_found=
  for apex_dir in (${apex_esp})/EFI/*; do
    regexp --set=1:apex_name '/EFI/([^/]+)/?$' "${apex_dir}"
    apex_loader=
    apex_skip=
    # Apex's own loader, and the fallback loader every system may replace.
    if regexp '^([Ff][Ee][Dd][Oo][Rr][Aa]|[Bb][Oo][Oo][Tt])$' \
        "${apex_name}"; then
      apex_skip=1
    elif [ -f "${apex_dir}/shimx64.efi" ]; then
      apex_loader="/EFI/${apex_name}/shimx64.efi"
    elif [ -f "${apex_dir}/grubx64.efi" ]; then
      apex_loader="/EFI/${apex_name}/grubx64.efi"
    elif [ -f "${apex_dir}/Boot/bootmgfw.efi" ]; then
      apex_loader="/EFI/${apex_name}/Boot/bootmgfw.efi"
    fi
    if [ -n "${apex_loader}" ]; then
      apex_label="${apex_name}"
      if [ "${apex_name}" = ubuntu ]; then apex_label=Ubuntu; fi
      if [ "${apex_name}" = debian ]; then apex_label=Debian; fi
      if [ "${apex_name}" = opensuse ]; then apex_label=openSUSE; fi
      if [ "${apex_name}" = Microsoft ]; then apex_label=Windows; fi
      # The body runs when the entry is chosen, after the loop has moved
      # on, so the partition and loader are passed as its arguments.
      menuentry "${apex_label}" --id "apex-other-${apex_name}" \
          "${apex_esp}" "${apex_loader}" {
        set root="${2}"
        chainloader "${3}"
      }
      apex_found=1
    fi
  done
  if [ -n "${apex_found}" ]; then
    set timeout_style=menu
    if [ "${timeout}" -ge 0 -a "${timeout}" -lt 5 ]; then
      set timeout=5
    fi
  fi
fi
