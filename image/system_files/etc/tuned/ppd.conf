# In /etc because tuned-ppd 2.27 and 2.28 read the mapping from nowhere else. A local
# edit survives updates, and later Apex changes to this file are then not applied.

[main]
# Only a fallback: tuned-ppd first restores the mode it saved last.
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
power-saver=powersave
balanced=balanced
# Not tuned-ppd's throughput-performance: its [vm] and [sysctl] tunables are for servers.
performance=apex-performance

[battery]
# Modes not listed here use [profiles].
balanced=balanced-battery
