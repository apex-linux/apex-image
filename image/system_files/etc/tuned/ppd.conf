# tuned-ppd: GNOME's power modes (power-profiles-daemon API) to TuneD profiles
# (ARCHITECTURE §6.4).
#
# tuned-ppd reads this mapping only from /etc/tuned/ppd.conf (tuned 2.27 and 2.28:
# consts.PPD_CONFIG_FILE, no /usr fallback), which is why Apex ships a file in /etc
# (ARCHITECTURE §7.3). It is tuned-ppd's own default with one change: Performance maps
# to apex-performance (/usr/lib/tuned/profiles/apex-performance) instead of
# throughput-performance, whose [vm] and [sysctl] server tunables do not suit a laptop.
# tuned-ppd refuses to start on a file with a missing mode, an unknown TuneD profile or
# two modes on one profile, and GNOME then shows no power modes:
# image/checks/power.sh checks all of that at build time.
#
# /etc is merged at every update (ostree three-way merge): a local edit of this file
# is kept, and later Apex changes to it are then not applied.

[main]
# Fallback start mode. tuned-ppd first restores the last mode it saved in
# /etc/tuned/ppd_base_profile, then tries the mode of TuneD's recommended profile.
default=balanced
# Use the [battery] mapping while on battery.
battery_detection=true
# Follow ACPI platform_profile changes made by firmware hotkeys.
sysfs_acpi_monitor=true

[profiles]
# PPD mode = TuneD profile
power-saver=powersave
balanced=balanced
performance=apex-performance

[battery]
# PPD mode = TuneD profile, on battery; modes not listed use [profiles].
balanced=balanced-battery
