# UPower sees BAT0's charge limit only if both charge_control_end_threshold (added late
# by asus-nb-wmi) and 61-apex-battery.rules' CHARGE_LIMIT exist when it first sees the
# battery. The "-" keeps the bounded wait from ever stopping UPower from starting.

[Service]
ExecStartPre=-/usr/bin/timeout 10 /usr/bin/sh -c '\
    test -d /sys/class/power_supply/BAT0 || exit 0; \
    until test -e /sys/class/power_supply/BAT0/charge_control_end_threshold && \
        /usr/bin/udevadm info --query=property /sys/class/power_supply/BAT0 | \
        grep -q "^CHARGE_LIMIT="; \
    do sleep 0.2; done'
