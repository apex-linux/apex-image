# Start UPower only once BAT0's charge limit is visible, for at most 10 s
# (ARCHITECTURE §6.4).
#
# UPower decides whether a battery supports charge thresholds, and re-applies the
# saved limit, only when it first sees the battery. That needs both the sysfs attribute
# charge_control_end_threshold (added late by asus-nb-wmi) and the CHARGE_LIMIT udev
# property (set once 61-apex-battery.rules has re-run 60-upower-battery.rules). If
# upowerd starts in between, the limit stays off until UPower restarts.
#
# The wait is bounded by timeout(1), ends at once on machines without BAT0 (the VM
# qualification), and the leading "-" means it can never stop UPower from starting.
# It runs inside upower.service's sandbox, which allows reading sysfs and the udev
# database.

[Service]
ExecStartPre=-/usr/bin/timeout 10 /usr/bin/sh -c '\
    test -d /sys/class/power_supply/BAT0 || exit 0; \
    until test -e /sys/class/power_supply/BAT0/charge_control_end_threshold && \
        /usr/bin/udevadm info --query=property /sys/class/power_supply/BAT0 | \
        grep -q "^CHARGE_LIMIT="; \
    do sleep 0.2; done'
