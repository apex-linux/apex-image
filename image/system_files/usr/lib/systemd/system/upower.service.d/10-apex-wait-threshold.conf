# UPower reads BAT0's charge limit only when it first sees BAT0: wait, bounded and never failing
# the start, for asus-nb-wmi's late threshold attribute and 61-apex-battery.rules' CHARGE_LIMIT.

[Service]
ExecStartPre=-/usr/bin/timeout 10 /usr/bin/sh -c '\
    test -d /sys/class/power_supply/BAT0 || exit 0; \
    until test -e /sys/class/power_supply/BAT0/charge_control_end_threshold && \
        /usr/bin/udevadm info --query=property /sys/class/power_supply/BAT0 | \
        grep -q "^CHARGE_LIMIT="; \
    do sleep 0.2; done'
