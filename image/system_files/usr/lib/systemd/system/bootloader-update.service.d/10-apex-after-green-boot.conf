# The ESP is outside the rollback envelope: shim and GRUB may change only once
# apex-boot-assess has judged this boot green.

[Unit]
# With default dependencies multi-user.target, which wants this unit, would wait for it: a
# cycle through apex-boot-assess that systemd may break by dropping the assessment's job.
DefaultDependencies=no
Requires=sysinit.target
After=sysinit.target basic.target apex-boot-assess.service
Conflicts=shutdown.target
Before=shutdown.target

[Service]
# The assessment logs its decision before its last steps, but journald may still be
# behind when it exits.
ExecCondition=/usr/bin/sh -c '\
    unit=apex-boot-assess.service; \
    state=$$(/usr/bin/systemctl show -p ActiveState -p Result -p ExecMainStatus "$$unit" | \
        /usr/bin/sort | /usr/bin/paste -s -d " " -); \
    if [ "$$state" != "ActiveState=active ExecMainStatus=0 Result=success" ]; then \
        echo "$$unit has not finished every step of this boot ($$state): the ESP is left alone"; \
        exit 1; \
    fi; \
    id=$$(/usr/bin/systemctl show -p InvocationID --value "$$unit"); \
    tries=0; \
    until decision=$$(/usr/bin/journalctl --boot "_SYSTEMD_INVOCATION_ID=$$id" --output=cat \
            --no-pager --quiet | /usr/bin/grep "decision: " | /usr/bin/tail -n 1); \
        [ -n "$$decision" ] || [ "$$tries" -ge 10 ]; do \
        tries=$$((tries + 1)); \
        /usr/bin/sleep 1; \
    done; \
    case "$$decision" in \
    *"(report green "* | *"(report green)"*) \
        echo "$$unit judged this boot green: bootupctl may update the ESP"; \
        exit 0 ;; \
    esac; \
    echo "$$unit did not judge this boot green ($${decision:-no decision in its journal}): the ESP is left alone"; \
    exit 1'
