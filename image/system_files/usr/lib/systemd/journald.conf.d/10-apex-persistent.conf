# Keep the journal across reboots (RECOVERY.md: `journalctl -b -1`, and reading
# /var/log/journal from a live USB after failed boots).
#
# journald's default, Storage=auto, writes to disk only if /var/log/journal exists, and
# on Apex nothing creates it: the minimal compose has no persistent-journal setting (the
# fedora-bootc standard base adds this same drop-in), systemd's RPM creates the
# directory only in %post and only when /var is writable (never under rpm-ostree), and
# the image build empties /var/log. With Storage=persistent journald creates the
# directory itself once /var is mounted; image/checks/system.sh verifies the result.

[Journal]
Storage=persistent
