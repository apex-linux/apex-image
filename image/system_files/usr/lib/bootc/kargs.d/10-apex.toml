# No rd.shell=0: on the only machine, the dracut rescue shell beats a faster fallback.
kargs = [
  # Plymouth's graphical splash and LUKS prompt need it.
  "rhgb",
  "quiet",
  # Boot counting rolls an update back only if a panicked boot reaches GRUB.
  "panic=10",
  # Keeps nouveau off the dGPU in the initramfs too. libkmod does not normalise names
  # here, so nova_core needs its '_'.
  "modprobe.blacklist=nouveau,nova_core",
  "rd.driver.blacklist=nouveau,nova_core",
  # Otherwise systemd's ssh generator socket-activates the installed sshd.
  "systemd.ssh_auto=no",
]
# Rust's std::env::consts::ARCH names.
match-architectures = ["x86_64"]
