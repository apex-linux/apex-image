# The origin becomes ostree-image-signed:, so every later pull refuses a policy that
# defaults to insecureAcceptAnything. It does not verify the install source itself.

[install]
enforce-container-sigpolicy = true

# Read only by `bootc install to-disk` (throwaway VMs); real installs use to-filesystem.
[install.filesystem.root]
type = "btrfs"
