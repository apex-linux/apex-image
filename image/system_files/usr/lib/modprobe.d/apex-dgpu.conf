# Keep the NVIDIA GA107 (10de:25a2) without a driver at M1 (ARCHITECTURE §6.4).
#
# The panel and HDMI are wired to the iGPU. Unbound, the dGPU can reach D3cold through
# its root port (61-apex-dgpu-pm.rules). nouveau and nova_core would bind it, need GSP
# firmware the image does not ship, and would stand in the way of the M2 NVIDIA path.
#
# `blacklist` only stops loading through a modalias (udev coldplug and hotplug). It
# does not stop an explicit `modprobe nouveau`, or a load pulled in as a dependency of
# another module (the `nova` DRM driver depends on nova_core). `install ... false`
# makes every such load fail with a visible modprobe error, so nothing binds the GPU
# by accident. The kernel command line repeats the blacklist for the initramfs
# (/usr/lib/bootc/kargs.d/10-apex.toml).
#
# To experiment with nouveau (for example NVK, an M2 option), create an empty
# /etc/modprobe.d/apex-dgpu.conf, which overrides this file, and load the module by
# hand; modprobe.blacklist= on the command line still blocks automatic loading.

blacklist nouveau
blacklist nova_core
install nouveau /usr/bin/false
install nova_core /usr/bin/false
