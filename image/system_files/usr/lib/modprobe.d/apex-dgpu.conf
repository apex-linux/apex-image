# No driver binds the GA107 (10de:25a2), so that it can reach D3cold. `blacklist` only
# stops modalias loads; `install ... false` also fails explicit and dependency loads.
# An empty /etc/modprobe.d/apex-dgpu.conf overrides this file for experiments.

blacklist nouveau
blacklist nova_core
install nouveau /usr/bin/false
install nova_core /usr/bin/false
