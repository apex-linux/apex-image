# Turn the 80 % battery charge limit on by default (ARCHITECTURE §6.4).
#
# UPower re-applies thresholds at startup only when
# /var/lib/upower/charging-threshold-status contains exactly "1" (g_strcmp0 in
# up-device-battery.c, UPower 1.91.4). It writes that file itself (mode 0640) when the
# user flips "Preserve Battery Health" in Settings, and nothing else creates it.
#
# Type "f" creates the file only when it is missing, writes the argument verbatim with
# no trailing newline, and creates /var/lib/upower (a %ghost directory in the RPM) if
# it does not exist yet. A user who turns the limit off gets "0" written by UPower, and
# that choice is kept. The mode matches what UPower writes, so tmpfiles never has to
# change it back. The limit values (75/80, only the end applies on this laptop) come
# from UPower's own hwdb.

f /var/lib/upower/charging-threshold-status 0640 root root - 1
