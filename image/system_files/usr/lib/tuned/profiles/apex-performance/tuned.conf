# throughput-performance's [cpu] and [acpi] settings on top of balanced, without its
# server tunables ([vm], [sysctl], disk readahead): they trade latency for bulk I/O.

[main]
summary=Apex performance: balanced with the CPU and platform at full performance, no server VM tuning
include=balanced

[cpu]
# amd-pstate-epp offers only performance and powersave.
governor=performance
energy_performance_preference=performance
# Per-policy cpufreq boost needs kernel 6.11 or later.
boost=1

[acpi]
# asus-wmi's fan and power limits, as the Fn+F5 modes set them.
platform_profile=performance
