#
# Apex "Performance" power mode (ARCHITECTURE §6.4): the TuneD profile that tuned-ppd
# selects for GNOME's Performance mode, on AC and on battery (/etc/tuned/ppd.conf).
#
# tuned-ppd's stock Performance profile is throughput-performance, a server profile.
# This one takes its [cpu] and [acpi] settings and leaves out its server tunables:
# [vm] dirty_bytes/dirty_background_bytes, [sysctl] vm.swappiness and
# net.core.somaxconn, and [disk] readahead. They trade interactive latency for bulk
# I/O throughput, so here the kernel defaults stay.
#
# It includes balanced (as balanced-battery does) instead of copying it, so switching
# between the modes changes only what differs, and balanced's desktop settings (audio
# codec power saving, SATA link power management, panel power savings off) stay. TuneD
# merges an included profile section by section; the options below replace balanced's.
#
# On this laptop (Ryzen 5 5600H, amd-pstate in active/EPP mode):
#   governor=performance       amd-pstate-epp offers only performance and powersave;
#                              under performance the kernel also sets EPP to performance
#   energy_performance_preference=performance
#                              the same hint, explicitly (TuneD skips an unchanged value)
#   boost=1                    per-policy cpufreq boost (kernels 6.11 and later)
#   platform_profile=performance
#                              asus-wmi's fan and power limits (the Fn+F5 modes), through
#                              /sys/firmware/acpi/platform_profile
# balanced's energy_perf_bias is an Intel setting; TuneD skips it on AMD CPUs.
# image/checks/power.sh checks these values and the absence of vm/sysctl/disk tuning.

[main]
summary=Apex performance: balanced with the CPU and platform at full performance, no server VM tuning
include=balanced

[cpu]
governor=performance
energy_performance_preference=performance
boost=1

[acpi]
platform_profile=performance
