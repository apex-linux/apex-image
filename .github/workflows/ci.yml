name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A runner has the machine to itself: build independent stages at once and
# compile with all four CPUs.
env:
  APEX_BUILD_CPUS: 4
  APEX_BUILD_JOBS: 3
  # The runner is thrown away, so there is no cache to keep.
  APEX_KEEP_CACHE: 0

jobs:
  conventions:
    uses: apex-linux/.github/.github/workflows/conventions.yml@main

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install --yes just
      - run: just lint

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install --yes just
      - run: just build
      - if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          echo "${TOKEN}" | podman login ghcr.io --password-stdin
          --username "${{ github.actor }}"
      - if: github.event_name == 'push'
        run: just publish

  # The NVIDIA flavor builds on its own runner, so that a driver or kernel
  # mismatch blocks only this flavor.
  build-nvidia:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install --yes just
      - run: just build nvidia
      - if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          echo "${TOKEN}" | podman login ghcr.io --password-stdin
          --username "${{ github.actor }}"
      - if: github.event_name == 'push'
        run: just publish nvidia
