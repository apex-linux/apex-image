# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

# No path filter: biometric data can arrive in any directory (the privacy job).
on:
  pull_request: {}
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

# Runs on main always finish, so that each one saves the Rust cache.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: apex-lane fmt, clippy, test, deny
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Tools for checkout, the cache and the tests
        # git, tar and diffutils: apex-lane's shell_fakes.rs.
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core tar gzip zstd xz findutils curl python3 diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/fedora-rust@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          # A pull request must not seed the cache that main uses.
          save-if: ${{ github.event_name == 'push' }}

      - uses: apex-linux/apex-ci/actions/install-tool@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
        with:
          tools: cargo-deny

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo deny
        run: cargo deny --locked check

  scripts:
    name: shellcheck, actionlint, selftest, devloop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/install-tool@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
        with:
          tools: actionlint shellcheck

      - name: actionlint
        # With shellcheck on PATH, actionlint also checks every run: block.
        run: actionlint -config-file .github/scripts/actionlint.yaml

      - name: bash -n and shellcheck of the CI, builder VM, runner and test scripts
        run: |
          for f in .github/scripts/*.sh tools/*.sh tools/builder-vm/*.sh tools/runner/*.sh tests/*/*.sh; do bash -n "$f"; done
          shellcheck -x -P .github/scripts --severity=style .github/scripts/*.sh
          shellcheck -x --severity=style tools/*.sh tools/builder-vm/*.sh tools/runner/*.sh tests/*/*.sh

      - name: sh -n, bash -n and shellcheck of image/checks and image/tests
        # The Containerfile's final stage runs image/checks with sh.
        run: |
          files=(image/checks/*.sh image/checks/lib/*.sh image/tests/*.sh image/tests/fake/createrepo_c)
          for f in "${files[@]}"; do sh -n "$f"; bash -n "$f"; done
          shellcheck -x -P SCRIPTDIR -s sh --severity=style "${files[@]}"

      - name: Script self-tests
        run: .github/scripts/selftest.sh

      - name: The dev loop's host side, against a fake ssh
        run: tests/devloop/run.sh

      - name: renovate.json is valid JSON
        run: jq empty renovate.json

  image-tests:
    name: image/tests/run.sh (Fedora 45, pinned components)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
      # Mount namespaces for bubblewrap in t-repos.sh; the runner is disposable and this job holds no secrets.
      options: --privileged
    env:
      APEX_IMAGE_TESTS_NO_SKIP: "1"
    steps:
      - name: Tools of the checks and their tests
        # dash: run.sh runs every file with sh and with dash.
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core python3 bubblewrap dash bash coreutils diffutils findutils gawk grep sed
          systemd systemd-udev openssl glib2 gnupg2 cpio dnf5-plugins dconf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The components of components.lock
        # Without safe.directory, git refuses the runner-owned checkout to root, and
        # t-lists.sh silently leaves out its .gitignore checks.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --git-dir >/dev/null
          tools/components.sh fetch
          tools/components.sh env >"$RUNNER_TEMP/components.env"

      - name: image/tests/run.sh
        run: |
          . "$RUNNER_TEMP/components.env"
          image/tests/run.sh

  contracts:
    name: contracts with the pinned components
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
      # Mount namespaces for bubblewrap's /proc/cmdline fixture in apex-gnome's layer tests.
      options: --privileged
    env:
      APEX_LAYER_TESTS_NO_SKIP: "1"
    steps:
      - name: git, python3, gjs, glib2, gi-compile-repository for the layer's fixture typelibs, and bubblewrap
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core python3 gjs glib2 /usr/bin/gi-compile-repository bubblewrap bash coreutils gawk grep sed

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The components of components.lock
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/components.sh fetch
          tools/components.sh env >"$RUNNER_TEMP/components.env"

      - name: The image installs and checks the hardware profile's firmware (apex-system)
        run: |
          . "$RUNNER_TEMP/components.env"
          .github/scripts/contracts.sh

      - name: apex-gnome's layer tests against the pinned apex-desktop
        # The layer tests carry copies of apex-desktop's schema and crash guard unit.
        run: |
          . "$RUNNER_TEMP/components.env"
          "$APEX_GNOME_SRC/tests/layer/run.sh"

  privacy:
    name: No biometric files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/privacy-guard@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main

  comments:
    name: Comment guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/comments@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
