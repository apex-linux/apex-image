[workspace]
resolver = "3"
members = ["crates/apex-lane"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["Thuong Vo <66083331+SekiroKenjii@users.noreply.github.com>"]
repository = "https://github.com/apex-linux/apex-image"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
nix = { version = "0.31.3", features = ["ioctl", "fs"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.6"

proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev.package."*"]
# Dependencies compile once with optimisations; our code stays debuggable.
opt-level = 1
